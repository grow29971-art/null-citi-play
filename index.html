		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html {
	padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
	overscroll-behavior: none;
}

body {
	position: fixed;
	inset: 0;
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#ios-install-hint {
	position: fixed;
	z-index: 2;
	top: max(12px, env(safe-area-inset-top, 0px));
	left: max(12px, env(safe-area-inset-left, 0px));
	right: max(12px, env(safe-area-inset-right, 0px));
	width: fit-content;
	max-width: 480px;
	margin: 0 auto;
	padding: 12px;
	border: 1px solid #587084;
	border-radius: 8px;
	background: #111923;
	font: 14px/1.5 system-ui, sans-serif;
}

#ios-install-hint:not([hidden]) { display: flex; align-items: center; gap: 12px; }
#ios-install-hint button {
	min-width: 44px;
	min-height: 44px;
	border: 1px solid #587084;
	border-radius: 4px;
	background: #243447;
	color: white;
	font: inherit;
}

#canvas {
	display: block;
	position: fixed !important;
	left: var(--game-left, 0px) !important;
	top: var(--game-top, 0px) !important;
	width: var(--game-width, 100vw) !important;
	height: var(--game-height, 100dvh) !important;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="description" content="NULL CITI · 사이버펑크 좀비 생존 로그라이크 웹 체험판"><meta name="robots" content="noindex,nofollow">
	</head>
	<body>
		<canvas id="canvas" width="1152" height="648">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>
		<aside id="ios-install-hint" hidden aria-label="아이폰 전체 화면 실행 안내">
			<span><strong>주소창 없이 플레이</strong><br>Safari 공유 → 홈 화면에 추가 → 추가한 아이콘으로 실행<br>‘웹 앱으로 열기’가 보이면 켜 주세요.</span>
			<button type="button" id="dismiss-install-hint" aria-label="전체 화면 안내 닫기">닫기</button>
		</aside>

		<script src="index.js"></script>
<script src="public-pack-loader.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":617820940,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// Fill the visible area while keeping the game's logical UI at least 1152 x 648.
function fitGameCanvas() {
	const viewport = window.visualViewport;
	const safe = getComputedStyle(document.documentElement);
	const left = parseFloat(safe.paddingLeft) || 0, right = parseFloat(safe.paddingRight) || 0;
	const top = parseFloat(safe.paddingTop) || 0, bottom = parseFloat(safe.paddingBottom) || 0;
	const width = (viewport ? viewport.width : window.innerWidth) - left - right;
	const height = (viewport ? viewport.height : window.innerHeight) - top - bottom;
	if (width <= 0 || height <= 0) return;
	const scale = Math.min(width / 1152, height / 648);
	const canvas = document.getElementById('canvas');
	const logicalWidth = Math.round(width / scale), logicalHeight = Math.round(height / scale);
	if (canvas.width !== logicalWidth) canvas.width = logicalWidth;
	if (canvas.height !== logicalHeight) canvas.height = logicalHeight;
	const style = canvas.style;
	style.setProperty('--game-width', `${width}px`);
	style.setProperty('--game-height', `${height}px`);
	style.setProperty('--game-left', `${(viewport ? viewport.offsetLeft : 0) + left}px`);
	style.setProperty('--game-top', `${(viewport ? viewport.offsetTop : 0) + top}px`);
}
window.addEventListener('resize', fitGameCanvas);
window.addEventListener('orientationchange', fitGameCanvas);
window.addEventListener('pageshow', fitGameCanvas);
if (window.visualViewport) {
	window.visualViewport.addEventListener('resize', fitGameCanvas);
	window.visualViewport.addEventListener('scroll', fitGameCanvas);
}
fitGameCanvas();

function isGameStandalone() {
	return navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches;
}

const installHint = document.getElementById('ios-install-hint');
let installHintDismissed = false;
try { installHintDismissed = sessionStorage.getItem('ios-install-hint-dismissed') === '1'; } catch (_) {}
function updateInstallHint() {
	const appleTouch = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	installHint.hidden = !appleTouch || isGameStandalone() || !!(document.fullscreenElement || document.webkitFullscreenElement) || installHintDismissed;
}
document.getElementById('dismiss-install-hint').addEventListener('click', () => {
	installHintDismissed = true;
	try { sessionStorage.setItem('ios-install-hint-dismissed', '1'); } catch (_) {}
	updateInstallHint();
});
updateInstallHint();

function enterGameFullscreen() {
	const root = document.documentElement;
	const request = root.requestFullscreen || root.webkitRequestFullscreen;
	if (isGameStandalone() || document.fullscreenElement || document.webkitFullscreenElement || !request) return;
	try {
		Promise.resolve(request.call(root, { navigationUI: 'hide' })).then(() => {
			if (screen.orientation && screen.orientation.lock) {
				screen.orientation.lock('landscape').catch(() => {});
			}
		}).catch(() => {});
	} catch (_) {}
}
// Touch activation becomes available on pointerup, rather than pointerdown.
document.getElementById('canvas').addEventListener('pointerup', enterGameFullscreen, { capture: true });
document.addEventListener('keydown', (event) => {
	if (event.key === 'Enter' && !event.repeat) enterGameFullscreen();
});
function gameFullscreenChanged() {
	updateInstallHint();
	fitGameCanvas();
	requestAnimationFrame(fitGameCanvas);
}
document.addEventListener('fullscreenchange', gameFullscreenChanged);
document.addEventListener('webkitfullscreenchange', gameFullscreenChanged);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		startPublicGame(engine, {
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>

</html>
